name: Validate and publish update
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-publish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: fileinfo
      - run: find . -name '*.php' -not -path './shared/*' -print0 | xargs -0 -n1 php -l
      - run: php tests/check.php
      - run: php -d disable_functions=putenv tests/check.php
      - run: php tests/http.php
      - run: node --test tests/update-ui.test.cjs
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash -n deploy/setup.sh deploy/install-updater.sh deploy/bootstrap-web-update.sh
  publish:
    needs: validate
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build code-only package
        env:
          TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 -B deploy/build-release.py --tag "$TAG" --commit "$GITHUB_SHA" --output 52okp-oss.tar.gz
      - name: Publish tested update (no production deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$TAG" 52okp-oss.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "程序更新 $TAG" --notes "已通过 PHP 8.5 及更新安全测试。提交：$GITHUB_SHA。管理员在后台点击更新后才上线。"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
